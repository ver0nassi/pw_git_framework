[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pw-git-framework"
version = "0.1.0"
description = "A Playwright-based UI automation framework built with Python."
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Ver0nassi", email = "your.email@example.com" }
]

dependencies = [
    "playwright>=1.61,<2.0",
    "pytest>=8.0,<9.0",
    "pytest-playwright>=0.7,<1.0",
    "pydantic>=2.13,<3.0",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/<your-github-username>/pw-git-framework"

[tool.setuptools.packages.find]
where = ["."]
